<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="robotAvatarClip">
      <circle cx="50" cy="50" r="49"/>
    </clipPath>
    <linearGradient id="robotBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="robotBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="robotVisorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="robotGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="robotRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#robotAvatarClip)">
    <!-- Cybernetic Matrix Background -->
    <rect width="100" height="100" fill="url(#robotBgGrad)"/>

    <!-- Ambient HUD Radar Circles -->
    <circle cx="50" cy="50" r="43" fill="none" stroke="#00f5d4" stroke-width="0.8" stroke-dasharray="6 8" opacity="0.3"/>
    <circle cx="50" cy="50" r="37" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="2 10" opacity="0.25"/>

    <!-- Central Antenna & Beacon -->
    <rect x="48.5" y="14" width="3" height="13" rx="1.5" fill="#475569"/>
    <circle cx="50" cy="14" r="3.5" fill="url(#robotGlowGrad)"/>
    <circle cx="50" cy="14" r="1.5" fill="#ffffff"/>

    <!-- Articulated Mechanical Neck -->
    <rect x="44" y="66" width="12" height="10" rx="2" fill="#1e293b"/>
    <line x1="45" y1="69" x2="55" y2="69" stroke="#00f5d4" stroke-width="1" opacity="0.65"/>
    <line x1="45" y1="73" x2="55" y2="73" stroke="#00f5d4" stroke-width="1" opacity="0.65"/>

    <!-- Armored Torso / Shoulders -->
    <path d="M 18 100 L 26 80 L 40 76 L 60 76 L 74 80 L 82 100 Z" fill="url(#robotBodyGrad)"/>
    <path d="M 26 80 L 40 76 L 43 100" stroke="#475569" stroke-width="1.2" fill="none"/>
    <path d="M 74 80 L 60 76 L 57 100" stroke="#475569" stroke-width="1.2" fill="none"/>
    
    <!-- Chest Power Core -->
    <polygon points="50,81 55,87 50,93 45,87" fill="#00f5d4" filter="url(#cyanGlow)"/>
    <polygon points="50,83 53,87 50,91 47,87" fill="#ffffff"/>

    <!-- Ear Sensor Pods -->
    <rect x="20" y="38" width="6" height="16" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="23" cy="46" r="1.5" fill="#00f5d4"/>
    <rect x="74" y="38" width="6" height="16" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="77" cy="46" r="1.5" fill="#00f5d4"/>

    <!-- Main Head Chassis -->
    <rect x="24" y="25" width="52" height="42" rx="14" fill="url(#robotBodyGrad)" stroke="#475569" stroke-width="1.5"/>
    <path d="M 34 25 C 42 22 58 22 66 25" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Visor Glass Panel -->
    <rect x="28" y="32" width="44" height="27" rx="9" fill="url(#robotVisorGrad)" stroke="#00f5d4" stroke-width="1.2" stroke-opacity="0.45"/>
    
    <!-- Visor Specular Glare -->
    <path d="M 31 34 L 46 34 L 38 44 L 31 44 Z" fill="#ffffff" opacity="0.08"/>

    <!-- Glowing Cybernetic Eyes (LED Optical Units) -->
    <rect x="34" y="39" width="10" height="11" rx="4" fill="#00f5d4" filter="url(#cyanGlow)"/>
    <rect x="37" y="42" width="4" height="5" rx="1.5" fill="#ffffff"/>
    <rect x="56" y="39" width="10" height="11" rx="4" fill="#00f5d4" filter="url(#cyanGlow)"/>
    <rect x="59" y="42" width="4" height="5" rx="1.5" fill="#ffffff"/>

    <!-- Inter-ocular Sensor Bridge -->
    <path d="M 46 44.5 L 54 44.5" stroke="#00f5d4" stroke-width="1.2" stroke-dasharray="1.5 1.5" opacity="0.7"/>

    <!-- Friendly Digital Speaker Grille / Smile -->
    <path d="M 43 53 Q 50 56.5 57 53" stroke="#00f5d4" stroke-width="1.6" stroke-linecap="round" fill="none" filter="url(#cyanGlow)"/>
  </g>

  <!-- Concentric Outer Circular Rim -->
  <circle cx="50" cy="50" r="48.5" fill="none" stroke="url(#robotRimGrad)" stroke-width="1.8" opacity="0.9"/>
</svg>