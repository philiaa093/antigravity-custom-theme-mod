<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="pixelAvatarClip">
      <circle cx="50" cy="50" r="49"/>
    </clipPath>
    <linearGradient id="pixelRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#pixelAvatarClip)" shape-rendering="crispEdges">
    <!-- Retro Arcade Dark Canvas -->
    <rect width="100" height="100" fill="#0b0e1a"/>

    <!-- Arcade Pixel Stars -->
    <rect x="16" y="16" width="4" height="4" fill="#4ade80" opacity="0.9"/>
    <rect x="80" y="20" width="4" height="4" fill="#38bdf8" opacity="0.9"/>
    <rect x="20" y="68" width="4" height="4" fill="#f59e0b" opacity="0.85"/>
    <rect x="76" y="72" width="4" height="4" fill="#ec4899" opacity="0.85"/>
    <rect x="84" y="44" width="4" height="4" fill="#a855f7" opacity="0.75"/>

    <!-- Shoulders & Cyber Hoodie (Rows 18-24) -->
    <rect x="32" y="72" width="36" height="4" fill="#059669"/>
    <rect x="24" y="76" width="52" height="4" fill="#059669"/>
    <rect x="16" y="80" width="68" height="20" fill="#047857"/>
    <!-- Hoodie Accents & Cyber Zipper -->
    <rect x="32" y="76" width="8" height="4" fill="#34d399"/>
    <rect x="60" y="76" width="8" height="4" fill="#34d399"/>
    <rect x="48" y="72" width="4" height="28" fill="#00f5d4"/>

    <!-- Neck (Rows 16-17) -->
    <rect x="40" y="64" width="20" height="8" fill="#fba05a"/>

    <!-- Hair Spikes Base (Rows 4-7) -->
    <rect x="40" y="16" width="20" height="4" fill="#6366f1"/>
    <rect x="32" y="20" width="36" height="4" fill="#4338ca"/>
    <rect x="32" y="20" width="4" height="4" fill="#00f5d4"/>
    <rect x="64" y="20" width="4" height="4" fill="#00f5d4"/>
    <rect x="28" y="24" width="44" height="4" fill="#312e81"/>
    <rect x="24" y="28" width="52" height="4" fill="#1e1b4b"/>

    <!-- Cyber Headband (Row 9) -->
    <rect x="28" y="36" width="44" height="4" fill="#f59e0b"/>
    <rect x="48" y="36" width="4" height="4" fill="#00f5d4"/>

    <!-- Side Hair Over Headband -->
    <rect x="28" y="32" width="4" height="8" fill="#1e1b4b"/>
    <rect x="68" y="32" width="4" height="8" fill="#1e1b4b"/>

    <!-- Face / Skin (Rows 10-15) -->
    <rect x="28" y="40" width="44" height="4" fill="#fed7aa"/>
    <rect x="28" y="52" width="44" height="4" fill="#fed7aa"/>
    <rect x="32" y="56" width="36" height="4" fill="#fed7aa"/>
    <rect x="36" y="60" width="28" height="4" fill="#fed7aa"/>

    <!-- Retro DJ / Cyber Headphones (Cols 5-6 and 18-19, Rows 10-13) -->
    <rect x="20" y="40" width="8" height="16" fill="#4ade80"/>
    <rect x="24" y="44" width="4" height="8" fill="#22c55e"/>
    <rect x="72" y="40" width="8" height="16" fill="#4ade80"/>
    <rect x="72" y="44" width="4" height="8" fill="#22c55e"/>

    <!-- Cyber Shades / Visor (Rows 11-12) -->
    <!-- Left Lens -->
    <rect x="28" y="44" width="20" height="8" fill="#09090b"/>
    <rect x="32" y="44" width="4" height="4" fill="#ffffff"/>
    <rect x="36" y="48" width="8" height="4" fill="#00f5d4"/>
    <!-- Bridge -->
    <rect x="48" y="44" width="4" height="4" fill="#09090b"/>
    <!-- Right Lens -->
    <rect x="52" y="44" width="20" height="8" fill="#09090b"/>
    <rect x="56" y="44" width="4" height="4" fill="#ffffff"/>
    <rect x="60" y="48" width="8" height="4" fill="#00f5d4"/>

    <!-- Cheeks & Nose (Row 13) -->
    <rect x="32" y="52" width="4" height="4" fill="#f472b6"/>
    <rect x="64" y="52" width="4" height="4" fill="#f472b6"/>
    <rect x="48" y="52" width="4" height="4" fill="#fba05a"/>

    <!-- Pixel Smirk (Row 15) -->
    <rect x="44" y="60" width="12" height="4" fill="#b91c1c"/>
    <rect x="48" y="60" width="4" height="2" fill="#ffffff"/>
  </g>

  <!-- Concentric Outer Circular Rim -->
  <circle cx="50" cy="50" r="48.5" fill="none" stroke="url(#pixelRimGrad)" stroke-width="1.8" opacity="0.9"/>
</svg>