name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
            python: '3.12'
          - os: windows-latest
            node: '24'
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check syntax, shared assets and tracked files
        shell: bash
        run: |
          python scripts/check_repo.py
          bash -n scripts/install-unix.sh
          ignored_tracked=$(git ls-files -ci --exclude-standard)
          if [[ -n "$ignored_tracked" ]]; then
            echo 'Ignored files must not be tracked:'
            echo "$ignored_tracked"
            exit 1
          fi
      - name: Build and verify the shared payload
        shell: bash
        run: |
          python scripts/build_payload.py --themes themes/themes.json
          node --check dist/theme_payload.js
      - name: Python reference and compiler tests
        run: python -m pytest tests -q
      - name: Node integration tests
        run: node --test tests/test_image_design.js tests/test_studio_media.js tests/test_daemon_reconnect.js
      - name: Windows launcher and tray tests
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_start_all.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_restore_theme.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File tests/test_tray_headless.ps1
          exit $LASTEXITCODE
